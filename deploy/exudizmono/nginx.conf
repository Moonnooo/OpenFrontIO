upstream frontrank_create { server 127.0.0.1:3001; server 127.0.0.1:3002; }
server {
 server_name game.exudizmono.com 77.68.55.16;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 location ^~ /.well-known/acme-challenge/ { root /opt/frontrank/public; }
 location = /credits { return 302 /credits/; }
 location = /credits/ { root /opt/frontrank/public; try_files /credits.html =404; }
 location = /clans { return 302 /clans/; }
 location = /clans/ { root /opt/frontrank/public; try_files /clans.html =404; }
 location = /clans/app.js { alias /opt/frontrank/public/clans-app.js; }
 location = /stats { return 302 /stats/; }
 location = /stats/ { root /opt/frontrank/public; try_files /stats.html =404; }
 location = /stats/app.js { alias /opt/frontrank/public/app.js; }
 location = /stats/style.css { alias /opt/frontrank/public/style.css; }
 location = /source.tar.gz { alias /opt/frontrank/public/source.tar.gz; }
 location ~* ^/(?:w[0-9]+/)?api/(?:admin|admin-bot|adminbot)(?:/|$) { return 403; }
 location ~* ^/backend/(?:game|cluster/checkin|matchmaking/checkin)(?:/|$) { return 403; }
 location /backend/auth/ {
  access_log off;
  proxy_pass http://127.0.0.1:8787/auth/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Api-Key "";
 }
 location /backend/ {
  proxy_pass http://127.0.0.1:8787/;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Api-Key "";
 }
 location = /w0 { proxy_pass http://127.0.0.1:3001/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
 location = /w1 { proxy_pass http://127.0.0.1:3002/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
 location /w0/ { proxy_pass http://127.0.0.1:3001/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
 location /w1/ { proxy_pass http://127.0.0.1:3002/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }
 location = /api/create_game { proxy_pass http://frontrank_create; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
 location / { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_read_timeout 3600s; }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/game.exudizmono.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/game.exudizmono.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}





server {
    if ($host = game.exudizmono.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


 listen 80 default_server;
 server_name game.exudizmono.com 77.68.55.16;
    return 404; # managed by Certbot


}