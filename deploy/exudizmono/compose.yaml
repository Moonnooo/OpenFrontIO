services:
  api:
    image: frontrank-game:exudizmono-0.2.8
    command: ["node", "--import", "tsx", "api.mjs"]
    network_mode: host
    env_file:
      - path: runtime.env
      - path: signin.env
        required: false
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./deploy/api.mjs:/app/api.mjs:ro
      - ./deploy/accounts.mjs:/app/accounts.mjs:ro
      - ./deploy/leaderboards.mjs:/app/leaderboards.mjs:ro
      - ./deploy/clans.mjs:/app/clans.mjs:ro
    restart: unless-stopped
    mem_limit: 1g
    logging:
      options: { max-size: "10m", max-file: "3" }
  game:
    image: frontrank-game:exudizmono-0.2.8
    network_mode: host
    env_file: runtime.env
    environment:
      ENABLE_AUTHORITATIVE_NAVAL: "true"
      ENABLE_PUBLIC_AUTHORITATIVE_NAVAL: "true"
    depends_on: [api]
    volumes:
      - ./public/game-index.html:/app/static/index.html:ro
      - ./deploy/jwt.ts:/app/src/server/jwt.ts:ro
    restart: unless-stopped
    mem_limit: 4g
    logging:
      options: { max-size: "10m", max-file: "3" }
